spring:
  application:
    name: first-spring-boot

  datasource:
    url: jdbc:postgresql://localhost:5432/first_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        generate_statistics: false
    open-in-view: false

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

  mail:
    host: ${MAIL_HOST:smtp.example.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: 8080
  servlet:
    context-path: /api
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain

# JWT Configuration
jwt:
  access-token:
    secret: ${JWT_ACCESS_SECRET:your-256-bit-access-secret-key-for-jwt-token-generation-min-32}
    expiration: 900000  # 15 minutes in milliseconds
  refresh-token:
    secret: ${JWT_REFRESH_SECRET:your-256-bit-refresh-secret-key-for-jwt-token-generation-min32}
    expiration: 604800000  # 7 days in milliseconds

# ECM/Alfresco Configuration
ecm:
  alfresco:
    enabled: ${ECM_ENABLED:true}
    endpoint: ${ECM_ENDPOINT:http://localhost:8081}
    admin-username: ${ECM_ADMIN_USER:admin}
    admin-password: ${ECM_ADMIN_PASS:admin}
    user-hash-salt: ${ECM_HASH_SALT:fina-salt}
    fi-registry-root-path: /Sites/FINA/DocumentLibrary/FI_REGISTRY
    connection-timeout: 30000
    read-timeout: 60000
    max-connections: 50

# Application-specific configuration
app:

  security:
    password-policy:
      min-length: 8
      require-uppercase: true
      require-lowercase: true
      require-numbers: true
      require-special-characters: true
      password-history-count: 5

  file-storage:
    upload-dir: ${FILE_UPLOAD_DIR:/var/fina/first/uploads}
    max-file-size: 52428800  # 50MB

  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
    allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600

# Logging configuration
logging:
  level:
    root: INFO
    net.fina.first: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

# OpenAPI documentation
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
