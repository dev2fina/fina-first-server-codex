<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FIRST - Login</title>

    <style>

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {

            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

        }

        .login-container {

            background: white;

            padding: 40px;

            border-radius: 12px;

            box-shadow: 0 10px 40px rgba(0,0,0,0.3);

            width: 100%;

            max-width: 400px;

        }

        .logo {

            text-align: center;

            margin-bottom: 30px;

        }

        .logo h1 {

            color: #1e3c72;

            font-size: 28px;

            margin-bottom: 5px;

        }

        .logo p {

            color: #666;

            font-size: 14px;

        }

        .form-group {

            margin-bottom: 20px;

        }

        .form-group label {

            display: block;

            margin-bottom: 8px;

            font-weight: 500;

            color: #333;

        }

        .form-group input {

            width: 100%;

            padding: 12px 15px;

            border: 2px solid #e0e0e0;

            border-radius: 8px;

            font-size: 16px;

            transition: border-color 0.3s;

        }

        .form-group input:focus {

            outline: none;

            border-color: #1e3c72;

        }

        .btn {

            width: 100%;

            padding: 14px;

            background: #1e3c72;

            color: white;

            border: none;

            border-radius: 8px;

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;

            transition: background 0.3s;

        }

        .btn:hover {

            background: #2a5298;

        }

        .btn:disabled {

            background: #ccc;

            cursor: not-allowed;

        }

        .error-message {

            background: #ffebee;

            color: #c62828;

            padding: 12px;

            border-radius: 8px;

            margin-bottom: 20px;

            display: none;

        }

        .success-message {

            background: #e8f5e9;

            color: #2e7d32;

            padding: 12px;

            border-radius: 8px;

            margin-bottom: 20px;

            display: none;

        }

        .api-config {

            margin-bottom: 20px;

            padding: 15px;

            background: #f5f5f5;

            border-radius: 8px;

        }

        .api-config label {

            font-size: 12px;

            color: #666;

        }

        .api-config input {

            font-size: 14px;

            padding: 8px 10px;

        }

        .links {

            text-align: center;

            margin-top: 20px;

            padding-top: 20px;

            border-top: 1px solid #eee;

        }

        .links a {

            color: #1e3c72;

            text-decoration: none;

            margin: 0 10px;

        }

        .links a:hover {

            text-decoration: underline;

        }

        .token-display {

            margin-top: 20px;

            padding: 15px;

            background: #f5f5f5;

            border-radius: 8px;

            display: none;

        }

        .token-display h3 {

            font-size: 14px;

            color: #333;

            margin-bottom: 10px;

        }

        .token-display .token {

            font-family: monospace;

            font-size: 11px;

            word-break: break-all;

            background: #1e1e1e;

            color: #4CAF50;

            padding: 10px;

            border-radius: 4px;

            max-height: 100px;

            overflow-y: auto;

        }

        .token-display .actions {

            margin-top: 10px;

            display: flex;

            gap: 10px;

        }

        .token-display .actions button {

            flex: 1;

            padding: 8px;

            font-size: 12px;

            border-radius: 4px;

            cursor: pointer;

            border: none;

        }

        .btn-copy {

            background: #4CAF50;

            color: white;

        }

        .btn-workflow {

            background: #2196F3;

            color: white;

        }

        .btn-swagger {

            background: #FF9800;

            color: white;

        }

        .btn-logout {

            background: #f44336;

            color: white;

        }

        .user-info {

            text-align: center;

            padding: 15px;

            background: #e3f2fd;

            border-radius: 8px;

            margin-bottom: 20px;

            display: none;

        }

        .user-info .username {

            font-weight: bold;

            color: #1e3c72;

        }

    </style>

</head>

<body>

<div class="login-container">

    <div class="logo">

        <h1>FIRST</h1>

        <p>Financial Institution Registry System</p>

    </div>



    <div class="user-info" id="userInfo">

        Logged in as: <span class="username" id="loggedInUser"></span>

    </div>



    <div class="error-message" id="errorMessage"></div>

    <div class="success-message" id="successMessage"></div>



    <div class="api-config">

        <div class="form-group" style="margin-bottom: 0;">

            <label>API Base URL</label>

            <input type="text" id="baseUrl" value="http://localhost:8080/api" />

        </div>

    </div>



    <form id="loginForm">

        <div class="form-group">

            <label for="username">Username</label>

            <input type="text" id="username" placeholder="Enter username" value="admin" required />

        </div>



        <div class="form-group">

            <label for="password">Password</label>

            <input type="password" id="password" placeholder="Enter password" value="admin123" required />

        </div>



        <button type="submit" class="btn" id="loginBtn">Login</button>

    </form>



    <div class="token-display" id="tokenDisplay">

        <h3>Access Token (stored in localStorage)</h3>

        <div class="token" id="tokenValue"></div>

        <div class="actions">

            <button class="btn-copy" onclick="copyToken()">Copy Token</button>

            <button class="btn-logout" onclick="logout()">Logout</button>

        </div>

        <div class="actions" style="margin-top: 5px;">

            <button class="btn-workflow" onclick="goToWorkflow()">Workflow Test</button>

            <button class="btn-swagger" onclick="goToSwagger()">Swagger UI</button>

        </div>

    </div>



    <div class="links">

        <a href="workflow-test.html">Workflow Test</a>

        <a href="../swagger-ui.html">Swagger UI</a>

        <a href="../v3/api-docs">API Docs</a>

    </div>

</div>



<script>

    // Check for existing token on page load

    window.onload = function() {

        const token = localStorage.getItem('first_access_token');

        const username = localStorage.getItem('first_username');



        if (token) {

            showLoggedInState(token, username);

        }

    };



    document.getElementById('loginForm').addEventListener('submit', async function(e) {

        e.preventDefault();



        const baseUrl = document.getElementById('baseUrl').value;

        const username = document.getElementById('username').value;

        const password = document.getElementById('password').value;

        const loginBtn = document.getElementById('loginBtn');



        hideMessages();

        loginBtn.disabled = true;

        loginBtn.textContent = 'Logging in...';



        try {

            const response = await fetch(`${baseUrl}/v1/auth/login`, {

                method: 'POST',

                headers: {

                    'Content-Type': 'application/json'

                },

                body: JSON.stringify({ username, password })

            });



            const data = await response.json();



            if (response.ok && data.accessToken) {

                // Store token and user info in localStorage

                localStorage.setItem('first_access_token', data.accessToken);

                localStorage.setItem('first_refresh_token', data.refreshToken || '');

                localStorage.setItem('first_username', username);

                localStorage.setItem('first_base_url', baseUrl);

                localStorage.setItem('first_token_expires', Date.now() + (data.expiresIn || 900000));



                showSuccess('Login successful!');

                showLoggedInState(data.accessToken, username);

            } else {

                showError(data.message || data.error || 'Login failed. Please check your credentials.');

            }

        } catch (error) {

            showError('Connection error: ' + error.message);

        } finally {

            loginBtn.disabled = false;

            loginBtn.textContent = 'Login';

        }

    });



    function showLoggedInState(token, username) {

        document.getElementById('loginForm').style.display = 'none';

        document.getElementById('tokenDisplay').style.display = 'block';

        document.getElementById('tokenValue').textContent = token;

        document.getElementById('userInfo').style.display = 'block';

        document.getElementById('loggedInUser').textContent = username || 'User';

    }



    function logout() {

        localStorage.removeItem('first_access_token');

        localStorage.removeItem('first_refresh_token');

        localStorage.removeItem('first_username');

        localStorage.removeItem('first_token_expires');



        document.getElementById('loginForm').style.display = 'block';

        document.getElementById('tokenDisplay').style.display = 'none';

        document.getElementById('userInfo').style.display = 'none';



        showSuccess('Logged out successfully');

    }



    function copyToken() {

        const token = localStorage.getItem('first_access_token');

        navigator.clipboard.writeText(token).then(() => {

            showSuccess('Token copied to clipboard!');

        }).catch(() => {

            // Fallback for older browsers

            const textArea = document.createElement('textarea');

            textArea.value = token;

            document.body.appendChild(textArea);

            textArea.select();

            document.execCommand('copy');

            document.body.removeChild(textArea);

            showSuccess('Token copied to clipboard!');

        });

    }



    function goToWorkflow() {

        window.location.href = 'workflow-test.html';

    }



    function goToSwagger() {

        window.location.href = '../swagger-ui.html';

    }



    function showError(message) {

        const el = document.getElementById('errorMessage');

        el.textContent = message;

        el.style.display = 'block';

        document.getElementById('successMessage').style.display = 'none';

    }



    function showSuccess(message) {

        const el = document.getElementById('successMessage');

        el.textContent = message;

        el.style.display = 'block';

        document.getElementById('errorMessage').style.display = 'none';



        // Auto-hide success message

        setTimeout(() => {

            el.style.display = 'none';

        }, 3000);

    }



    function hideMessages() {

        document.getElementById('errorMessage').style.display = 'none';

        document.getElementById('successMessage').style.display = 'none';

    }

</script>

</body>

</html>
