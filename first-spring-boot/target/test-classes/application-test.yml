spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  h2:
    console:
      enabled: false

jwt:
  access-token:
    secret: test-access-secret-key-must-be-at-least-256-bits-long-for-hs256
    expiration: 900000  # 15 minutes
  refresh-token:
    secret: test-refresh-secret-key-must-be-at-least-256-bits-long-for-hs256
    expiration: 86400000  # 24 hours

ecm:
  alfresco:
    enabled: false

logging:
  level:
    net.fina.first: DEBUG
    org.springframework.security: DEBUG
